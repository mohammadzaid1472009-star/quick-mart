<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick M@rt Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">Quick M<span>@</span>rt</a><span class="sub">Professional Admin Dashboard</span><span id="badge" class="badge">0 open</span></header><main class="adminpage">
<section class="panel"><h2>Discord Ticket Channel</h2><p class="muted">Order Now will open this Discord channel. If you change the channel later, update the link here.</p><div class="admin-actions"><input id="discordLink" type="url" placeholder="https://discord.com/channels/SERVER_ID/CHANNEL_ID"><button class="primary" onclick="saveDiscordLink()">Save Discord Link</button></div><p id="discordStatus"></p></section>
<section class="panel"><h2>Payment QR</h2><p class="muted">Upload the UPI/payment QR customers should scan.</p><form id="qrForm"><input id="qr" type="file" accept="image/*" required><button class="primary">Save Payment QR</button></form><p id="qrStatus"></p><img id="qrPreview" class="qr adminqr" style="display:none"></section>
<section class="panel"><h2>Add Product</h2><form id="productForm"><input name="name" placeholder="Product name" required><textarea name="description" placeholder="Description"></textarea><input name="price" type="number" step="0.01" placeholder="Base price ₹" required><input name="stock" type="number" placeholder="Stock" value="0"><input name="image" type="file" accept="image/*"><button class="primary">Add Product</button></form></section>
<section class="panel"><h2>Products</h2><div id="plist"></div></section>
<section class="panel"><h2>Order Tickets</h2><div id="tlist"></div><div id="thread"></div></section>
</main><script>
let auth='Basic '+btoa(prompt('Admin username')+':'+prompt('Admin password'));
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:auth};return fetch(u,o)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function products(){let a=await api('/api/products').then(r=>r.json());plist.innerHTML=a.map(p=>`<div class="adminrow"><div><b>${esc(p.name)}</b><div class="muted">₹${Number(p.price).toFixed(2)} · stock ${p.stock}</div></div><span><button onclick="editP(${p.id})">✏️ Edit</button> <button onclick="del(${p.id})">🗑️ Delete</button></span></div>`).join('')||'<p class="muted">No products.</p>'}
productForm.onsubmit=async e=>{e.preventDefault();let r=await api('/api/products',{method:'POST',body:new FormData(productForm)});let d=await r.json();if(!r.ok)return alert(d.error);productForm.reset();products()}
async function editP(id){let a=await api('/api/products').then(r=>r.json()),p=a.find(x=>x.id==id);if(!p)return;let name=prompt('Product name',p.name);if(name===null)return;let description=prompt('Description',p.description||'');if(description===null)return;let price=prompt('Price in INR',p.price);if(price===null)return;let stock=prompt('Stock',p.stock);if(stock===null)return;let fd=new FormData();fd.append('name',name);fd.append('description',description);fd.append('price',price);fd.append('stock',stock);fd.append('keepImage','true');let r=await api('/api/products/'+id,{method:'PUT',body:fd});let d=await r.json();if(!r.ok)alert(d.error);products()}
async function del(id){if(!confirm('Delete this product?'))return;await api('/api/products/'+id,{method:'DELETE'});products()}
async function tickets(){let r=await api('/api/admin/tickets'),a=await r.json();let open=a.filter(t=>t.status==='Open').length;badge.textContent=open+' open';tlist.innerHTML=a.map(t=>`<div class="adminrow"><span><b>#${t.id}</b> · 👤 ${esc(t.username||'Unknown')} · ${esc(t.product_name)} ×${t.quantity} · ${esc(t.status)} · ₹${Number(t.final_total||t.total).toFixed(2)} ${t.payment_screenshot?'📷':''}</span><button onclick="openT(${t.id})">Open Chat</button></div>`).join('')||'<p class="muted">No tickets yet.</p>'}
async function openT(id){let d=await api('/api/admin/tickets/'+id).then(r=>r.json()),t=d.ticket,o=d.order;let discount=Number(t.discount||0),final=Number(t.final_total||o.total);thread.innerHTML=`<h3>🎫 Ticket #${t.id} · 👤 ${esc(t.username||'Unknown')}</h3><p>Order #${o.id} · ${esc(o.product_name)} · Qty ${o.quantity}</p><p>Original ₹${Number(o.total).toFixed(2)} · Discount ₹${discount.toFixed(2)} · <b>Final ₹${final.toFixed(2)}</b></p>${t.payment_screenshot?`<div><b>Payment screenshot:</b><br><img class="shot" src="${esc(t.payment_screenshot)}"></div>`:''}<div id="threadMsgs">${d.messages.map(m=>`<div class="msg ${esc(m.sender)}"><b>${m.sender==='customer'?'👤 '+esc(t.username||'Customer'):m.sender==='admin'?'🛡️ Admin':'⚙️ System'}</b><div>${esc(m.message)}</div><small>${esc(m.created_at||'')}</small></div>`).join('')}</div><div class="admin-actions"><input id="disc" type="number" min="0" step="0.01" placeholder="Discount ₹" value="${discount}"><button onclick="setDiscount(${id})">Apply Discount</button><input id="reply" placeholder="Message ${esc(t.username||'customer')}"><button class="primary" onclick="replyT(${id})">Send Message</button><select id="st"><option ${t.status==='Open'?'selected':''}>Open</option><option ${t.status==='Processing'?'selected':''}>Processing</option><option ${t.status==='Completed'?'selected':''}>Completed</option><option ${t.status==='Closed'?'selected':''}>Closed</option></select><button onclick="statusT(${id})">Update Status</button><button class="primary" onclick="paidT(${id})">✓ Payment Received / Complete</button></div>`}
async function replyT(id){let v=document.querySelector('#reply').value.trim();if(!v)return;await api('/api/admin/tickets/'+id+'/reply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:v})});openT(id)}
async function setDiscount(id){let v=Number(document.querySelector('#disc').value)||0;let r=await api('/api/admin/tickets/'+id+'/discount',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({discount:v})});let d=await r.json();if(!r.ok)alert(d.error);openT(id)}
async function statusT(id){await api('/api/admin/tickets/'+id+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:document.querySelector('#st').value})});tickets();openT(id)}
async function paidT(id){let r=await api('/api/admin/tickets/'+id+'/paid',{method:'POST'}),d=await r.json();if(!r.ok)alert(d.error);tickets();openT(id)}
qrForm.onsubmit=async e=>{e.preventDefault();let f=new FormData();f.append('qr',qr.files[0]);let r=await api('/api/admin/qr',{method:'POST',body:f}),d=await r.json();qrStatus.textContent=r.ok?'QR saved successfully.':d.error||'Upload failed';if(r.ok)loadQr()}
async function loadDiscordLink(){let r=await api('/api/discord-ticket-link');let d=await r.json();discordLink.value=d.url||''}
async function saveDiscordLink(){let url=discordLink.value.trim();let r=await api('/api/admin/discord-ticket-link',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url})});let d=await r.json();discordStatus.textContent=r.ok?'Discord link saved successfully.':(d.error||'Save failed')}
async function loadQr(){let r=await api('/api/admin/qr'),d=await r.json();if(d.file){qrPreview.src=d.file;qrPreview.style.display='block'}}
products();tickets();loadQr();loadDiscordLink();setInterval(tickets,5000);
</script></body></html>
