<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick M@rt Admin</title><link rel="icon" type="image/png" href="/quick-mart-logo.png"><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/" aria-label="Quick M@rt"><img class="brand-logo" src="/quick-mart-logo.png" alt="Quick M@rt logo"><span class="logo-text">Quick M<span>@</span>rt</span></a><span class="sub">Professional Admin Dashboard</span><button id="logoutBtn" style="display:none" onclick="adminLogout()">Logout</button></header><main class="adminpage"><section id="loginPanel" class="panel"><h2>Admin Login</h2><p class="muted">Your admin session stays active across refreshes for 7 days.</p><form id="adminLoginForm"><input id="adminUser" placeholder="Admin username" autocomplete="username" required><input id="adminPass" type="password" placeholder="Admin password" autocomplete="current-password" required><button class="primary" type="submit">Login</button><button type="button" onclick="cancelAdminLogin()">Cancel</button><p id="adminLoginResult"></p></form></section><div id="adminContent" style="display:none"><section class="panel"><h2>Main Discord Order Link</h2><p class="muted">Customers are sent directly to this Discord link when they click “Order Now”. You can change it anytime.</p><div class="admin-actions"><input id="discordLink" type="url" placeholder="https://discord.gg/yourinvite" autocomplete="off"><button class="primary" onclick="saveDiscordLink()">Save Main Link</button></div><p id="discordStatus"></p></section><section class="panel"><h2 id="productFormTitle">Add Product</h2><form id="productForm" enctype="multipart/form-data"><input name="name" placeholder="Product name" maxlength="120" required><textarea name="description" placeholder="Description / features" maxlength="2000"></textarea><input name="price" type="number" min="0.01" max="100000000" step="0.01" placeholder="Price in INR" required><input name="stock" type="number" min="0" max="100000000" step="1" placeholder="Stock quantity" value="0"><input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><label id="removeImageWrap" style="display:none"><input id="removeImage" type="checkbox"> Remove current image</label><div><button class="primary" id="productSubmit">Add Product</button><button type="button" id="cancelEdit" style="display:none" onclick="resetProductForm()">Cancel Edit</button></div><p id="productResult"></p></form></section><section class="panel"><div class="row"><h2>Products</h2><button onclick="products()">Refresh</button></div><div id="plist"></div></section></div></main><script>
let productCache=[],editingId=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(u,o={}){let r=await fetch(u,{cache:'no-store',...o});if(r.status===401&&u.startsWith('/api/admin/'))showLogin();return r}
function showLogin(){loginPanel.style.display='block';adminContent.style.display='none';logoutBtn.style.display='none'}function showAdmin(){loginPanel.style.display='none';adminContent.style.display='block';logoutBtn.style.display='inline-block';products();loadDiscordLink()}
function cancelAdminLogin(){adminLoginForm.reset();adminLoginResult.textContent='';showLogin()}
adminLoginForm.onsubmit=async e=>{e.preventDefault();adminLoginResult.textContent='Checking...';let r=await api('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:adminUser.value.trim(),password:adminPass.value})});let d=await r.json();if(!r.ok){adminLoginResult.textContent=d.error||'Login failed';return}adminPass.value='';showAdmin()}
async function checkAdmin(){let r=await api('/api/admin/me');if(r.ok)showAdmin();else showLogin()}
async function adminLogout(){await api('/api/admin/logout',{method:'POST'});resetProductForm();showLogin()}
async function products(){let r=await api('/api/admin/products');if(!r.ok)return;productCache=await r.json();plist.innerHTML=productCache.map(p=>`<div class="adminrow"><div>${p.image?`<img src="${esc(p.image)}" style="width:56px;height:56px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:10px">`:''}<b>${esc(p.name)}</b><div class="muted">₹${Number(p.price).toFixed(2)} · stock ${p.stock} · ID ${p.id}</div></div><span><button onclick="editP(${p.id})">Edit</button> <button onclick="delP(${p.id})">Delete</button></span></div>`).join('')||'<p class="muted">No products yet. Add your first product above.</p>'}
productForm.onsubmit=async e=>{e.preventDefault();productResult.textContent=editingId?'Updating product...':'Adding product...';let fd=new FormData(productForm);if(editingId)fd.append('removeImage',removeImage.checked?'true':'false');let r=await api(editingId?'/api/products/'+editingId:'/api/products',{method:editingId?'PUT':'POST',body:fd});let d=await r.json();if(!r.ok){productResult.textContent=d.error||'Save failed';return}productResult.textContent=editingId?'Product updated successfully.':'Product added successfully.';resetProductForm(false);products()}
function editP(id){let p=productCache.find(x=>x.id===id);if(!p)return;editingId=id;productFormTitle.textContent='Edit Product #'+id;productSubmit.textContent='Save Changes';cancelEdit.style.display='inline-block';removeImageWrap.style.display=p.image?'block':'none';removeImage.checked=false;productForm.name.value=p.name;productForm.description.value=p.description||'';productForm.price.value=p.price;productForm.stock.value=p.stock;productForm.image.value='';productResult.textContent='Current product loaded. Choose a new image only if you want to replace it.';window.scrollTo({top:document.querySelector('#productForm').getBoundingClientRect().top+window.scrollY-20,behavior:'smooth'})}
function resetProductForm(clearMessage=true){editingId=null;productForm.reset();productForm.stock.value=0;productFormTitle.textContent='Add Product';productSubmit.textContent='Add Product';cancelEdit.style.display='none';removeImageWrap.style.display='none';removeImage.checked=false;if(clearMessage)productResult.textContent=''}
async function delP(id){let p=productCache.find(x=>x.id===id);if(!p||!confirm(`Delete “${p.name}”? This cannot be undone.`))return;let r=await api('/api/products/'+id,{method:'DELETE'});let d=await r.json();if(!r.ok)return alert(d.error||'Delete failed');if(editingId===id)resetProductForm();products()}
async function loadDiscordLink(){let r=await api('/api/discord-ticket-link');let d=await r.json();discordLink.value=d.url||''}
async function saveDiscordLink(){let url=discordLink.value.trim(),r=await api('/api/admin/discord-ticket-link',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url})}),d=await r.json();discordStatus.textContent=r.ok?'Main Discord link saved successfully.':(d.error||'Save failed')}
checkAdmin();
</script></body></html>
