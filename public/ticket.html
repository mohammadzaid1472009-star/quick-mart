<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Ticket — Quick M@rt</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="logo" href="/">🛒 Quick M<span>@</span>rt</a><nav><a href="/">Home</a><a href="/orders">My Orders</a></nav></header><main class="narrow ticket"><div class="pagehead"><p class="eyebrow">CUSTOMER SUPPORT</p><h1 id="title">Loading ticket…</h1><p id="info"></p></div><div class="panel"><div id="messages"></div><form id="form"><textarea id="msg" placeholder="Write your message…" maxlength="2000" required></textarea><button class="primary">Send Message</button></form></div></main><script>const token=location.pathname.split('/').pop(),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const r=await fetch('/api/tickets/'+token),d=await r.json();if(!r.ok){title.textContent='Ticket not found';return}title.textContent='Support Ticket #'+d.ticket.id;info.innerHTML=`<b>${esc(d.ticket.subject)}</b> · ${esc(d.ticket.status)} · Order #${d.order.id} · ₹${Number(d.order.total).toFixed(2)}`;messages.innerHTML=d.messages.map(m=>`<div class="msg ${m.sender}"><b>${esc(m.sender)}</b><div>${esc(m.message)}</div><small>${esc(m.created_at)}</small></div>`).join('')}form.onsubmit=async e=>{e.preventDefault();const v=msg.value.trim();if(!v)return;await fetch('/api/tickets/'+token+'/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:v})});msg.value='';load()};load();setInterval(load,7000)</script></body></html>
