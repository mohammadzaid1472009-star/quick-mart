<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket — Quick M@rt</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">Quick M<span>@</span>rt</a><span class="sub">Support Center</span></header><main class="ticket"><div class="chat-shell"><div class="chat-head"><div><strong id="chatTitle">🎫 Ticket</strong><small id="chatUser"></small></div><span id="chatStatus" class="status">OPEN</span></div><div id="info" class="chat-info"></div><div id="messages" class="messages"></div><form class="chat-compose" onsubmit="send(event)"><input id="msg" placeholder="Type a message..."><button class="primary">Send ➤</button></form><div id="payment"></div><div class="upload"><h3>Payment Screenshot</h3><p class="muted">Pay only after admin confirms the amount and QR.</p><form onsubmit="uploadShot(event)"><input id="shot" type="file" accept="image/*" required><button>Upload Screenshot</button></form><p id="shotResult"></p></div></div></main><script>
const token=location.pathname.split('/').pop();
const SYMBOLS={INR:'₹',USD:'$',GBP:'£',AED:'د.إ',EUR:'€',SAR:'﷼',PKR:'₨',BDT:'৳',CAD:'C$',AUD:'A$',JPY:'¥',CNY:'¥',SGD:'S$',MYR:'RM',ZAR:'R',TRY:'₺',CHF:'CHF',BRL:'R$',MXN:'MX$',RUB:'₽'};
function money(v,code){try{return new Intl.NumberFormat(navigator.language,{style:'currency',currency:code,maximumFractionDigits:2}).format(v)}catch(e){return (SYMBOLS[code]||code)+' '+Number(v).toFixed(2)}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){let r=await fetch('/api/tickets/'+token),d=await r.json();if(!r.ok)return info.innerHTML='<h2>Ticket not found</h2>';let t=d.ticket,final=Number(t.final_total||d.order.total),discount=Number(t.discount||0),code=d.order.currency||'INR',rate=Number(d.order.currency_rate||1);chatTitle.textContent=`🎫 Ticket #${t.id}`;chatUser.textContent=`👤 ${t.username||'Customer'} · ${d.order.product_name}`;chatStatus.textContent=t.status.toUpperCase();chatStatus.className='status '+t.status.toLowerCase();info.innerHTML=`<div><b>Order #${d.order.id}</b> · ${esc(d.order.product_name)} · Qty ${d.order.quantity}</div><div class="amount"><span>Original: ${money(Number(d.order.total)*rate,code)}</span>${discount>0?`<span class="discount">Discount: −${money(discount*rate,code)}</span>`:''}<strong>Final: ${money(final*rate,code)}</strong></div>`;messages.innerHTML=d.messages.map(m=>{let who=m.sender==='customer'?t.username||'You':m.sender==='admin'?'Quick M@rt Staff':'System';return `<div class="bubble-row ${m.sender}"><div class="avatar">${m.sender==='admin'?'🛡️':m.sender==='customer'?'👤':'⚙️'}</div><div class="bubble"><b>${esc(who)}</b><div>${esc(m.message)}</div><small>${esc(m.created_at||'')}</small></div></div>`}).join('');messages.scrollTop=messages.scrollHeight;let qr=d.paymentQr;payment.innerHTML=qr?`<div class="paymentbox"><h3>💳 Pay ₹${final.toFixed(2)}</h3><img class="qr" src="${esc(qr)}"><p class="muted">Scan QR, then upload your payment screenshot below.</p></div>`:`<div class="paymentbox pending"><b>⏳ Payment QR pending</b><p>Staff will update your ticket.</p></div>`}
async function send(e){e.preventDefault();let v=msg.value.trim();if(!v)return;let r=await fetch('/api/tickets/'+token+'/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:v})});if(r.ok){msg.value='';load()}}
async function uploadShot(e){e.preventDefault();let f=shot.files[0],fd=new FormData();fd.append('screenshot',f);let r=await fetch('/api/tickets/'+token+'/payment-screenshot',{method:'POST',body:fd}),d=await r.json();shotResult.textContent=r.ok?'Screenshot uploaded. Staff will verify it.':(d.error||'Upload failed');if(r.ok)load()}
load();setInterval(load,4000);
</script></body></html>
