<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders — Quick M@rt</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="logo" href="/">🛒 Quick M<span>@</span>rt</a><nav><a href="/">Home</a><a class="active" href="/orders">My Orders</a></nav></header><main class="narrow"><section class="pagehead"><p class="eyebrow">ORDER LOOKUP</p><h1>My Orders</h1><p>Use the order ID and checkout email to securely view your order.</p></section><form class="lookup panel" id="f"><input id="id" type="number" min="1" placeholder="Order ID" required><input id="email" type="email" placeholder="Email" required><button class="primary">Find Order</button></form><div id="out"></div></main><script>const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/orders/'+id.value+'?email='+encodeURIComponent(email.value));const d=await r.json();out.innerHTML=r.ok?`<div class="panel orderdetail"><div class="order-title"><h2>Order #${d.id}</h2><span class="status">${esc(d.status)}</span></div><p>${d.items.map(x=>esc(x.product_name)+' × '+x.quantity+' — ₹'+Number(x.price).toFixed(2)).join('<br>')}</p><h3>Total: ₹${Number(d.total).toFixed(2)}</h3>${d.ticket?`<a class="primary linkbtn" href="/ticket/${esc(d.ticket.token)}">Open Support Ticket</a>`:''}</div>`:`<div class="panel error">${esc(d.error||'Order not found')}</div>`}</script></body></html>
