<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick M@rt</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">Quick M<span>@</span>rt</a><span class="sub">Your products. Your marketplace.</span><div class="tools"><select id="country" onchange="setCountry(this.value)"></select><select id="lang" onchange="setLang(this.value)"></select><span id="account"></span><a class="admin" href="/admin">Admin</a></div></header><main><section class="hero"><div><span class="pill">🌍 Global marketplace</span><h1 id="heroTitle">Discover something you’ll love.</h1><p id="heroSub">Shop in your local currency with a professional support ticket.</p><input id="search" placeholder="Search products..."></div></section><section id="products" class="grid"></section></main><div id="modal" class="modal hidden"><div class="box"><button class="x" onclick="closeBuy()">×</button><h2 id="buyName"></h2><p id="buyDesc"></p><b id="buyPrice"></b><input id="qty" type="number" min="1" value="1"><button class="primary" onclick="buy()" id="orderBtn">Create Order Ticket</button><p id="result"></p></div></div><div id="authModal" class="modal hidden"><div class="box"><button class="x" onclick="closeAuth()">×</button><div class="tabs"><button onclick="showAuth('login')">Login</button><button onclick="showAuth('register')">Register</button></div><form id="loginForm" onsubmit="login(event)"><h2>Welcome back</h2><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Password" required><button class="primary">Login</button><p id="loginResult"></p></form><form id="registerForm" class="hidden" onsubmit="register(event)"><h2>Create account</h2><input id="regUsername" placeholder="Username" required><input id="regEmail" placeholder="Email (e.g. zaid@bro.com)" required><input id="regPassword" type="password" placeholder="Password (6+ characters)" required><button class="primary">Create Account</button><p id="regResult"></p></form></div></div><script src="/app.js"></script></body></html>
